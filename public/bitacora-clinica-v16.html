<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi bitácora · Actividad de autoconocimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7;--surface:#FFFFFF;--surface-2:#F4F5FB;--ink:#1D2140;--muted:#545A7A;--line:#D5D9E8;
  --accent:#5A48D6;--accent-ink:#FFFFFF;--accent-soft:#E9E6FB;--mint:#1E9E80;--mint-soft:#DDF4EC;
  --sun:#FFC53D;--sun-soft:#FFF3D1;--care:#B3261E;--care-soft:#FCE8E6;
  --q-r:#FFD9D3;--q-y:#FFF0BC;--q-b:#D6E3FF;--q-g:#D2F1E2;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121429;--surface:#1B1E3A;--surface-2:#242849;--ink:#EEF0FF;--muted:#A9AECD;--line:#363C66;
    --accent:#A193FF;--accent-ink:#15123A;--accent-soft:#2D2A5A;--mint:#52D7B5;--mint-soft:#173A3A;
    --sun:#FFD166;--sun-soft:#3A3320;--care:#FF9C93;--care-soft:#3E1F25;
    --q-r:#4D2A31;--q-y:#4A4022;--q-b:#24324F;--q-g:#1D3F35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121429;--surface:#1B1E3A;--surface-2:#242849;--ink:#EEF0FF;--muted:#A9AECD;--line:#363C66;
  --accent:#A193FF;--accent-ink:#15123A;--accent-soft:#2D2A5A;--mint:#52D7B5;--mint-soft:#173A3A;
  --sun:#FFD166;--sun-soft:#3A3320;--care:#FF9C93;--care-soft:#3E1F25;
  --q-r:#4D2A31;--q-y:#4A4022;--q-b:#24324F;--q-g:#1D3F35;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em}
.stage{font-size:14px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.trail{display:flex;align-items:center;margin:22px 0 24px}
.trail .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);flex:none}
.trail .seg{flex:1;height:3px;background:var(--line)}
.trail .dot.done{background:var(--mint);border-color:var(--mint);color:var(--surface)}
.trail .seg.done{background:var(--mint)}
.trail .dot.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,40px)}
.sticker{display:inline-block;background:var(--sun);color:#2A2200;font-weight:700;padding:5px 13px;border-radius:9px;transform:rotate(-2deg);font-size:15px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.1;margin:16px 0 14px;letter-spacing:-.015em}
h1:focus{outline:none}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin:0 0 8px}
h3{font-size:18px;margin:20px 0 6px}
p{margin:0 0 12px}
.lead{font-size:19px}
.count{color:var(--muted);font-size:15px;font-weight:700}
.helper{font-size:15px;color:var(--muted)}
label,legend{display:block;font-weight:700;margin:18px 0 7px}
fieldset{border:0;padding:0;margin:0}
input[type=text],textarea,select{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:96px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.opt{font:inherit;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);cursor:pointer;min-height:54px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:inherit;font-size:16px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.card{background:var(--surface-2);border-radius:16px;padding:18px 20px;margin:16px 0}
.card p:last-child{margin-bottom:0}
.rules p{padding-left:16px;border-left:3px solid var(--mint)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.check.big{font-weight:700;margin-top:22px}
.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:56px;line-height:1;text-align:center;color:var(--accent);margin:8px 0}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:32px}
input[type=range].unset{opacity:.45}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
details.deeper{margin:18px 0;border:1.5px dashed var(--line);border-radius:14px;padding:4px 16px 12px}
details.deeper summary{cursor:pointer;font-weight:700;padding:10px 0}
.note{background:var(--sun-soft);border-radius:14px;padding:14px 16px;margin:16px 0}
.care{background:var(--care-soft);border-radius:14px;padding:14px 16px;margin:16px 0}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:28px}
.actions .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
button.primary,button.secondary,button.ghost{font:inherit;font-weight:700;border-radius:12px;padding:12px 20px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
button.secondary{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.ghost{background:transparent;color:var(--muted);border:2px solid transparent;text-decoration:underline;text-underline-offset:3px}
button:disabled{opacity:.4;cursor:not-allowed}
button.link{font:inherit;font-size:15px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:4px}

/* cuadro de energía y agrado */
.meterwrap{display:grid;grid-template-columns:22px minmax(0,360px);gap:6px;justify-content:center;margin:18px 0 10px}
.meter-y{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter{width:100%;height:auto;display:block;border-radius:16px;touch-action:none;cursor:crosshair;border:1.5px solid var(--line);user-select:none}
.meter .qr{fill:var(--q-r)}.meter .qy{fill:var(--q-y)}.meter .qb{fill:var(--q-b)}.meter .qg{fill:var(--q-g)}
.meter .ax{stroke:var(--muted);stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:4 5}
.meter .ql{font-size:34px;opacity:.5}
.meter .pinhalo{fill:var(--accent);opacity:.22}
.meter .pindot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.meter-x{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.qname{font-weight:700}

/* constelación */
.sky{width:100%;height:auto;background:#1C2050;border-radius:16px;display:block;margin:14px 0}
.sky .off{fill:#6D73A8}
.sky .on path{fill:#FFD166}
.sky text{fill:#EEF0FF;font-size:11px}
.sky .sl{stroke:#FFD166;stroke-opacity:.45;stroke-width:1.2}
.sky .new{animation:pop .55s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}

/* batería */
.battery{position:relative;display:flex;gap:4px;padding:6px;border:3px solid var(--ink);border-radius:10px;max-width:330px;margin:8px auto 14px}
.battery i{position:absolute;right:-11px;top:30%;width:7px;height:40%;background:var(--ink);border-radius:0 3px 3px 0}
.battery span{flex:1;height:34px;border-radius:4px;background:var(--line);transition:background .2s}
.battery span.on{background:var(--mint)}
.battery.low span.on{background:#F08A5D}
.battery.mid span.on{background:var(--sun)}

/* chat */
.phone{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin:16px 0;background:var(--surface-2)}
.phone-top{padding:10px 16px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:110px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:16px;line-height:1.4}
.msg b{display:block;font-size:12px;color:var(--accent)}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{align-self:center;color:var(--muted);font-size:14px;font-style:italic;text-align:center;max-width:100%;padding:2px 8px}
.msg.in{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.chatskip{display:block;margin:-8px 0 0 auto}
.pending,.gone{display:none!important}

/* mapa de personas */
.netwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start;margin:10px 0}
.net{width:100%;height:auto;overflow:visible;touch-action:none;user-select:none}
.net:focus{outline:none}
.net .ring{fill:none;stroke:var(--line);stroke-width:1.5}
.net .ring.r1{fill:var(--mint-soft)}
.net .me{fill:var(--accent)}
.net .metxt{fill:var(--accent-ink);font-weight:700;font-size:14px}
.net .rl{fill:var(--muted);font-size:11px}
.net .pg{cursor:grab}
.net .pg.dragging{cursor:grabbing;opacity:.85}
.net .pd{fill:var(--mint);stroke:var(--surface);stroke-width:2}
.net .pt{fill:var(--ink);font-size:12px}
.netform input,.netform select{margin-bottom:12px}
.netform label{margin-top:0}
.plist{list-style:none;padding:0;margin:14px 0 0}
.plist li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;border-bottom:1px solid var(--line);padding:6px 0}
.plist small{color:var(--muted)}

/* cápsula */
.capsule{transition:transform .9s ease-in,opacity .9s ease-in;transform-origin:center bottom}
.capsule textarea{background:var(--sun-soft);border-color:var(--sun);min-height:140px;line-height:1.7}
.capsule.sealing{transform:translateY(30px) scale(.5);opacity:0}
.sealed{text-align:center;font-weight:700;font-size:19px;margin:18px 0}
.sealed .env{font-size:58px;display:block;line-height:1.2}

/* respiración */
.breathbox{position:relative;width:210px;height:210px;margin:18px auto 10px}
.breath{position:absolute;inset:38px;border-radius:50%;background:var(--mint-soft);border:3px solid var(--mint);transition:transform 4s ease-in-out}
.breathtxt{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:18px;text-align:center}
.center{text-align:center}

/* cierre */
.bar{display:grid;grid-template-columns:minmax(0,1fr) 130px 28px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bt{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bt span{display:block;height:100%;background:var(--mint);border-radius:6px}
.bv{text-align:right;font-weight:700}
blockquote{margin:6px 0 0;padding:4px 0 4px 16px;border-left:3px solid var(--sun);font-size:18px}
.badges{display:flex;flex-wrap:wrap;gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;width:76px;font-size:13px;text-align:center;gap:4px}
.badge .bi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--sun-soft);border:2px solid var(--sun);transform:rotate(-5deg)}
.badge.off .bi{filter:grayscale(1);opacity:.35;border-color:var(--line);background:var(--surface-2)}
.radarcard{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.mini{width:150px;height:150px;border-radius:12px;display:block}
.mini .qr{fill:var(--q-r)}.mini .qy{fill:var(--q-y)}.mini .qb{fill:var(--q-b)}.mini .qg{fill:var(--q-g)}
.mini .pre{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.mini .post{fill:var(--accent)}
.mini .arr{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.footer{font-size:13px;color:var(--muted);margin:18px 2px;line-height:1.6}

/* insignia emergente */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ink);color:var(--surface);padding:10px 20px 10px 12px;border-radius:999px;font-weight:700;display:flex;gap:10px;align-items:center;transition:transform .35s ease-out;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
#toast .te{font-size:24px;width:38px;height:38px;border-radius:50%;background:var(--sun);display:grid;place-items:center}

@media (max-width:600px){
  .grid.two{grid-template-columns:1fr}
  .netwrap{grid-template-columns:1fr}
  .bar{grid-template-columns:minmax(0,1fr) 80px 24px}
  .radarcard{grid-template-columns:1fr;justify-items:center}
  .wrap{padding:14px 12px 30px}
}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,#toast{display:none!important}
  #print{display:block;font-size:13px;padding:10px}
  #print h1{font-size:24px;margin:0 0 6px}
  #print h3{margin:16px 0 4px}
  #print .mini{width:120px;height:120px}
  #print .bt{background:#ddd}#print .bt span{background:#555}
  #print *{color:#000!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand" id="brand">Mi bitácora</div>
    <div class="top-right">
      <span class="stage" id="stage"></span>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true" lang="es">Español</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">English</button>
      </div>
    </div>
  </header>
  <nav class="trail" id="trail" aria-label="Avance"></nav>
  <section class="panel" id="app"></section>
  <p class="footer" id="footer"></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>

  lowE:'Poca energía',highE:'Mucha energía',unpl:'A disgusto',pleas:'A gusto',
  meterAria:'Cuadro de cómo te sientes. Usa las flechas para mover el punto.',

function goStep(n,dir){S.step=n;const id=STEPS[n];
  if(id==='confianza')S.confIdx=dir>0?0:6;
  if(id==='historias')S.sceneIdx=dir>0?0:4;
  save();render()}
function advance(){const id=STEPS[S.step];
  if(id==='acuerdo'&&!S.assent)return;
  if(id==='confianza'&&S.confIdx<6){S.confIdx++;save();return render()}
  if(id==='historias'&&S.sceneIdx<4){S.sceneIdx++;save();return render()}
  if(id==='red'&&!S.network.length&&!S.netNoteShown){S.netNoteShown=true;save();return render('netnote')}
  if(MISSION[id]){delete S.skipped[id];earn(id)}
  if(S.step<STEPS.length-1)goStep(S.step+1,1)}
function retreat(){const id=STEPS[S.step];
  if(id==='confianza'&&S.confIdx>0){S.confIdx--;save();return render()}
  if(id==='historias'&&S.sceneIdx>0){S.sceneIdx--;save();return render()}
  if(S.step>0)goStep(S.step-1,-1)}

let timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));

function playChat(i){const msgs=[...document.querySelectorAll('#chat .msg.pending')],ty=$('#typing'),chat=$('#chat');let k=0;
  const step=()=>{if(k>=msgs.length)return finishChat(i);const m=msgs[k],sys=m.classList.contains('sys');
    if(!sys){chat.appendChild(ty);ty.classList.remove('gone')}
    later(()=>{ty.classList.add('gone');m.classList.remove('pending');m.classList.add('in');k++;later(step,sys?250:400)},sys?650:1100)};
  later(step,350)}

  const ty=$('#typing');if(ty)ty.classList.add('gone');
  document.querySelectorAll('.after-chat').forEach(e=>e.classList.remove('pending'));

function startBreath(){const el=$('#breath'),tx=$('#breathTxt'),btn=$('#breathBtn');if(!el)return;
  clearTimers();btn.disabled=true;let cycle=0;
  const inhale=()=>{tx.textContent=t('inhale');el.style.transitionDuration='4s';el.style.transform='scale(1.4)';later(exhale,4000)};
  const exhale=()=>{tx.textContent=t('exhale');el.style.transitionDuration='6s';el.style.transform='scale(1)';
    later(()=>{cycle++;if(cycle<3)inhale();else{tx.textContent=t('done');S.breathDone=true;save();btn.disabled=false;btn.textContent=t('repeat')}},6000)};
  inhale()}
function seal(){const cap=$('#capsule'),done=$('#sealed');
  app.querySelectorAll('.actions button').forEach(x=>x.disabled=true);
  if(reduceMotion())return advance();
  cap.classList.add('sealing');later(()=>{cap.classList.add('gone');done.classList.remove('gone')},900);later(advance,1900)}

function act(a,d){const id=STEPS[S.step];
  switch(a){
    case 'next':return advance();
    case 'back':return retreat();
    case 'skip':S.skipped[id]=true;earn(id);return goStep(S.step+1,1);
    case 'toggle':{const arr=getPath(d.path),v=+d.i,k=arr.indexOf(v);
      if(k>=0)arr.splice(k,1);else if(arr.length<+d.max){arr.push(v);if(d.path==='strengths')S.ui.newStar=v}
      save();render(d.fid);S.ui.newStar=null;return}
    case 'allEmos':S.ui['all_'+d.path]=!S.ui['all_'+d.path];save();return render('meter-'+d.path);
    case 'confSkip':S.conf[S.confIdx]='skip';return advance();
    case 'scene':{const s=S.scenes[S.sceneIdx];s.choice=+d.i;s.skipped=false;save();return render(d.fid)}
    case 'sceneSkip':{const s=S.scenes[S.sceneIdx];s.skipped=true;s.choice=null;return advance()}
    case 'chatAll':return finishChat(S.sceneIdx);
    case 'addPerson':{const r=$('#pRole'),role=r.value.trim();if(!role){r.focus();return}
      const ring=+$('#pRing').value,same=S.network.filter(p=>p.ring===ring).length;
      S.network.push({role,ring,ang:-Math.PI/2+.55+same*1.15});save();return render('prole')}
    case 'ring':{const p=S.network[+d.i];p.ring=clamp(p.ring+ +d.d,1,3);save();return render('net')}
    case 'delPerson':S.network.splice(+d.i,1);save();return render('prole');
    case 'print':return doPrint();
    case 'seal':return seal();
    case 'breathe':return startBreath();
    case 'reset':if(confirm(t('resetConfirm'))){try{sessionStorage.removeItem(KEY)}catch(e){}S=fresh(S.lang);render()}return;
  }}

function checkRisk(v){const box=$('#care');if(!box||box.dataset.on)return;
  if(RISK.test(v)){box.dataset.on='1';box.innerHTML=`<div class="care" role="status"><p>${t('care')}</p></div>`}}
function setRange(el){const v=Number(el.value);setPath(el.dataset.range,v);el.classList.remove('unset');
  const n=document.getElementById(el.dataset.num);if(n)n.textContent=v;
  const bt=document.querySelector(`[data-battery="${el.dataset.num}"]`);
  if(bt){bt.querySelectorAll('span').forEach((s,k)=>s.classList.toggle('on',k<v));bt.classList.toggle('low',v<=3);bt.classList.toggle('mid',v>3&&v<=6)}
  save()}

function renderChrome(){document.documentElement.lang=S.lang;document.title=t('title');
  $('#brand').textContent=t('brand');$('#footer').textContent=t('footer');
  document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===S.lang)));
  const id=STEPS[S.step],m=MISSION[id]||0,after=S.step>STEPS.indexOf('mensaje');
  const st=[];for(let i=1;i<=7;i++)st.push(after||i<m?'done':i===m?'now':'');
  $('#trail').innerHTML=st.map((s,i)=>(i?`<span class="seg ${st[i-1]==='done'&&s!==''?'done':''}"></span>`:'')+`<span class="dot ${s}" aria-hidden="true">${i+1}</span>`).join('');
  const label=m?t('stage',{m}):(S.step<2?t('stStart'):t('stEnd'));
  $('#stage').textContent=label;$('#trail').setAttribute('aria-label',m?label:t('progress'))}

function render(focusId){clearTimers();const id=STEPS[S.step];
  app.innerHTML=V[id]();renderChrome();
  app.querySelectorAll('[data-bind]').forEach(el=>checkRisk(el.value));
  if(id==='historias'&&app.querySelector('#chat .msg.pending'))playChat(S.sceneIdx);
  const el=focusId&&document.querySelector(`[data-fid="${focusId}"]`);
  if(el){el.focus({preventScroll:false});return}
  window.scrollTo(0,0);const h=$('#h');if(h)h.focus({preventScroll:true})}

/* ---------- arrastre ---------- */
function toSvg(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
let drag=null;
function meterMove(e){const q=toSvg(drag.svg,e),m=getPath(drag.path);
  m.pt={x:clamp(q.x/150-1),y:clamp(1-q.y/150)};
  const pin=drag.svg.querySelector('.pin');pin.style.display='';pin.setAttribute('transform',`translate(${(m.pt.x+1)*150},${(1-m.pt.y)*150})`)}
const app=$('#app');
app.addEventListener('pointerdown',e=>{
  const ms=e.target.closest('svg[data-meter]');
  if(ms){drag={type:'meter',svg:ms,path:ms.dataset.meter};ms.setPointerCapture(e.pointerId);meterMove(e);e.preventDefault();return}
  const pg=e.target.closest('.pg');
  if(pg){drag={type:'person',svg:pg.ownerSVGElement,g:pg,i:+pg.dataset.person,ox:+pg.dataset.x,oy:+pg.dataset.y};pg.classList.add('dragging');drag.svg.setPointerCapture(e.pointerId);e.preventDefault()}});
app.addEventListener('pointermove',e=>{if(!drag)return;
  if(drag.type==='meter')return meterMove(e);
  const q=toSvg(drag.svg,e);drag.g.setAttribute('transform',`translate(${q.x-drag.ox},${q.y-drag.oy})`)});
function endDrag(e){if(!drag)return;const d=drag;drag=null;
  if(d.type==='meter'){save();return render('meter-'+d.path)}
  const q=toSvg(d.svg,e),dx=q.x-170,dy=q.y-170,dist=Math.hypot(dx,dy),p=S.network[d.i];
  if(Math.hypot(q.x-d.ox,q.y-d.oy)>6){p.ring=dist<=62?1:dist<=112?2:3;p.ang=Math.atan2(dy,dx)}
  save();render('net')}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);

/* ---------- eventos ---------- */
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled)act(el.dataset.act,el.dataset);
  if(e.target.matches('input[type=range]'))setRange(e.target)});
app.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){setPath(el.dataset.bind,el.value);save();checkRisk(el.value)}
  if(el.dataset.range)setRange(el)});
app.addEventListener('change',e=>{const el=e.target;
  if(el.id==='assent'){S.assent=el.checked;save();const n=app.querySelector('[data-act="next"]');if(n)n.disabled=!el.checked}});
app.addEventListener('keydown',e=>{
  if(e.target.id==='pRole'&&e.key==='Enter'){e.preventDefault();return act('addPerson',{})}
  const ms=e.target.closest&&e.target.closest('svg[data-meter]');
  const dirs={ArrowLeft:[-.1,0],ArrowRight:[.1,0],ArrowUp:[0,.1],ArrowDown:[0,-.1]};
  if(ms&&dirs[e.key]){e.preventDefault();const m=getPath(ms.dataset.meter),pt=m.pt||{x:0,y:0};
    m.pt={x:clamp(+(pt.x+dirs[e.key][0]).toFixed(2)),y:clamp(+(pt.y+dirs[e.key][1]).toFixed(2))};save();render('meter-'+ms.dataset.meter)}});
document.querySelectorAll('[data-lang]').forEach(x=>x.addEventListener('click',()=>{if(S.lang===x.dataset.lang)return;S.lang=x.dataset.lang;save();render()}));

window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='MI_UNIVERSO_INIT')return;const a=e.data.answers;if(a&&typeof a==='object'&&Number.isInteger(a.step)&&a.step>=0&&a.step<=10){S={...fresh(),...a};render()}else{save()}});
render();
</script>
</body>
</html>
